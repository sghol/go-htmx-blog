<!doctype html>
<html lang="fa">
  <head>

    <title>Task Manager</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/htmx.min.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="navbar">
        <h1 class="brand">سعید غلامی</h1>
        <nav class="nav-items">
          <a href="#">نوشته ها</a>
          <a href="#">درباره</a>

      <main class="main">

          {{ end }}
        </ul>
      </main>
      <footer>footer</footer>
    </div>
  </body>
</html>
